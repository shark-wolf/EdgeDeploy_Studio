# ==============================================================================
# 所属模块: Config
# 文件路径: analysis_options.yaml
# 核心职责: Dart 静态代码分析与架构分层 Lint 规则配置（禁止启用任何实验性语言标志）
# ==============================================================================
include: package:flutter_lints/flutter.yaml

analyzer:
  # 严格禁止在此处配置 enable-experiment
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**

linter:
  rules:
    - always_declare_return_types
    - cancel_subscriptions
    - close_sinks
    - prefer_final_fields
    - prefer_final_locals
    - use_build_context_synchronously
