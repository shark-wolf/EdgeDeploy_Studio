# ==============================================================================
# 所属模块: Config
# 文件路径: pubspec.yaml
# 核心职责: Flutter 工程依赖声明（严格锁定 Stable 通道组件，零实验性代码生成依赖）
# ==============================================================================
name: EdgeDeploy_Studio
description: "EdgeDeploy-Studio: Cloudflare Workers & Pages 桌面发布端，基于 Flutter 构建。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.1
  logger: ^2.0.2
  file_picker: ^8.0.0  # 确保包含此项用于桌面端目录选择
  shared_preferences: ^2.2.2 # 用于本地持久化存储发布历史
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4  # 匹配本系统的稳定版图标生成工具

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

flutter_launcher_icons:
  image_path: "assets/icons/app_icon.png"
  android: false
  ios: false
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"
  linux:
    generate: true
    image_path: "assets/icons/app_icon.png"
